[project]
name = "topo_an"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "bokeh>=3.9.0",
    "colorcet>=3.2.1",
    "matplotlib>=3.10.9",
    "pydantic>=2.13.3",
    "pyproj>=3.7.2",
    "pyqt5>=5.15.11",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "typer>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
anim = "topo_an.cli.app:app"
